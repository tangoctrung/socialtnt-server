name: Docker Image CI

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /home/code/socialtnt-server
            git fetch origin
            git checkout master
            git pull
            docker build -t api-socialtnt .
            docker stop api-socialtnt-container  true
            docker rm api-socialtnt-container  true
            docker run -d --name api-socialtnt-container -p 8800:8800 api-socialtnt
